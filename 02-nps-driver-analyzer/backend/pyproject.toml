[project]
name = "nps-backend"
version = "0.1.0"
description = "NPS & Driver Analyzer backend (use case 2)."
requires-python = ">=3.14"
dependencies = [
  "polars>=1.44",
  "fastexcel>=0.11",
  "xlsxwriter>=3.2",
  "fastapi>=0.142.2",
  "uvicorn>=0.54.0",
  "tzdata>=2026.4",  # Windows has no time zone database for Python's zoneinfo
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
